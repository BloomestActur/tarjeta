<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tarjeta de lavados · Bloomest Actur</title>
<meta name="theme-color" content="#b0202f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis lavados">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-192.png">
<style>
:root{
  --rojo:#b0202f; --rojo-osc:#8a1624; --rojo-claro:#fbeaec; --tinta:#17181a; --crema:#f3ece2;
  --papel:#fffdf9; --gris:#77736c; --linea:#e6ded2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  color:var(--tinta);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh; padding:max(18px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));
  background-color:var(--crema);
  background-image:radial-gradient(circle at 12% 8%,rgba(176,32,47,.08) 0 90px,transparent 91px),
                   radial-gradient(circle at 92% 30%,rgba(23,24,26,.05) 0 70px,transparent 71px),
                   radial-gradient(circle at 20% 95%,rgba(176,32,47,.06) 0 120px,transparent 121px);
  background-attachment:fixed;
}
#app{max-width:440px;margin:0 auto}

/* ---------- Tarjeta ---------- */
.tarjeta{
  position:relative; background:var(--papel); border-radius:26px; overflow:hidden;
  box-shadow:0 1px 0 #fff inset,0 18px 40px -12px rgba(60,20,25,.28),0 3px 8px rgba(60,20,25,.08);
}
.tarjeta::before{content:"";display:block;height:7px;background:linear-gradient(90deg,var(--rojo-osc),var(--rojo) 55%,#cf3a4a)}
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 14px}
.logo{height:72px;width:auto;display:block;margin:-6px 0 -6px -2px}
.mes{text-align:right;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);line-height:1.35}
.mes b{display:block;font-size:15px;letter-spacing:0;text-transform:none;color:var(--tinta)}
.mes b::first-letter{text-transform:uppercase}

/* muesca tipo ticket */
.corte{position:relative;height:0;border-top:2px dashed var(--linea);margin:0 22px}
.corte::before,.corte::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--crema)}
.corte::before{left:-35px}.corte::after{right:-35px}

.cuerpo{padding:20px 20px 22px}
.titulo{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rojo);font-weight:700;margin:0 0 6px}
.reto{font-size:15px;line-height:1.35;margin:0 0 18px}
.reto b{color:var(--rojo)}

/* ---------- Casillas ---------- */
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.hueco{text-align:center}
.casilla{
  position:relative; aspect-ratio:1/1; border-radius:20px; background:#fff;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--linea); box-shadow:inset 0 2px 5px rgba(60,40,30,.07);
}
.casilla img{width:66%;height:66%;object-fit:contain;opacity:.22;filter:grayscale(1)}
.num{position:absolute;left:9px;top:6px;font-size:11px;font-weight:700;color:#bdb6aa}
.fecha{display:inline-block;margin-top:8px;min-height:20px;font-size:12px;line-height:20px;color:transparent}
.hueco.hecho .casilla{border-color:rgba(176,32,47,.55);background:linear-gradient(165deg,#fff 35%,var(--rojo-claro));box-shadow:0 4px 10px -4px rgba(176,32,47,.35)}
.hueco.hecho .casilla img{opacity:1;filter:none}
.hueco.hecho .num{display:none}
.hueco.hecho .fecha{color:#fff;background:var(--rojo);border-radius:20px;padding:0 10px;font-weight:700;letter-spacing:.03em;box-shadow:0 2px 5px -1px rgba(138,22,36,.45)}

/* tacha: trazo fino de rotulador */
.tacha{position:absolute;inset:-3%;width:106%;height:106%;overflow:visible;animation:sello .45s cubic-bezier(.2,1.3,.4,1) both}
.tacha path{fill:none;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:trazo .34s cubic-bezier(.5,.1,.3,1) forwards}
.tacha .base{stroke:var(--rojo);stroke-width:4.2}
.tacha .luz{stroke:#e0707c;stroke-width:1.2;opacity:.8}
.tacha .t1{animation-delay:.05s}.tacha .t2{animation-delay:.26s}
@keyframes trazo{to{stroke-dashoffset:0}}
@keyframes sello{from{transform:scale(1.18) rotate(-5deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* premio */
.premio .casilla{border:2px dashed rgba(176,32,47,.6);background:var(--rojo-claro);box-shadow:none}
.premio .casilla img{opacity:.4;filter:grayscale(1)}
.premio .fecha{color:var(--rojo);font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase}
.premio.logrado .casilla{border:2px solid var(--rojo);background:radial-gradient(circle at 50% 35%,#fff 0,var(--rojo-claro) 70%);box-shadow:0 0 0 5px rgba(176,32,47,.12),0 8px 18px -6px rgba(176,32,47,.5);animation:late 1.8s ease-in-out infinite}
.premio.logrado .casilla img{opacity:1;filter:none}
@keyframes late{50%{box-shadow:0 0 0 9px rgba(176,32,47,.06),0 8px 18px -6px rgba(176,32,47,.5)}}

/* ---------- Progreso y plazo ---------- */
.estado{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.contador{display:flex;align-items:baseline;gap:4px;line-height:1}
.contador b{font-size:44px;font-weight:800;color:var(--rojo);letter-spacing:-.02em}
.contador span{font-size:18px;color:var(--gris);font-weight:600}
.contador small{margin-left:6px;font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.08em}
.plazo{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:14px;background:#f3ede4;font-size:13px;line-height:1.2;color:var(--tinta)}
.plazo svg{flex:none;width:20px;height:20px;stroke:var(--rojo);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.plazo b{display:block;font-size:15px}
.plazo.urge{background:var(--rojo);color:#fff}.plazo.urge svg{stroke:#fff}
.barra{height:9px;border-radius:9px;background:#eee6da;overflow:hidden}
.barra i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--rojo-osc),var(--rojo),#d24556);transition:width .8s cubic-bezier(.3,.8,.3,1)}
.msg{margin:16px 0 0;padding:13px 15px;border-radius:16px;font-size:14.5px;line-height:1.4;background:#f6f1e9;border-left:4px solid var(--rojo)}
.msg.ok{background:#eaf4ea;border-left-color:#3a8a4a}
.pie{margin-top:16px;font-size:11.5px;color:var(--gris);text-align:center;line-height:1.5}
.aviso{margin-top:16px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--linea);font-size:13px;line-height:1.45;color:#444}
.vacio{text-align:center;padding:48px 20px}
.vacio h1{font-size:20px}
.vacio p{color:var(--gris);line-height:1.5}
</style>
</head>
<body>
<div id="app"><div class="vacio"><p>Cargando tu tarjeta…</p></div></div>

<script>
/* ===== CONFIGURACIÓN ===== */
// URL de la Web App de Apps Script (termina en /exec). Es pública; el secreto es el token del enlace.
const API = 'PEGAR_URL_DEL_WEB_APP_AQUI';
const ICONO_LAVADORA = 'lavadora.png';
const ICONO_PREMIO = 'premio.png';

const $app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function leer(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function guardar(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function borrar(k){ try { localStorage.removeItem(k); } catch(e){} }
const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

function fechaCorta(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? (+m[3]) + ' ' + MESES[+m[2] - 1] : '';
}
function nombreMes(yyyymm){
  const m = /^(\d{4})-(\d{2})$/.exec(yyyymm || '');
  return m ? new Date(+m[1], +m[2] - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }) : '';
}
/* Días que quedan hasta el último día de la promo (0 = hoy es el último día) */
function diasRestantes(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  if (!m) return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(+m[1], +m[2] - 1, +m[3]);
  return Math.max(Math.round((fin - hoy) / 86400000), 0);
}
function textoPlazo(dias){
  if (dias === 0) return '<b>Último día</b>de la promo';
  if (dias === 1) return '<b>Queda 1 día</b>para el fin de la promo';
  return '<b>Quedan ' + dias + ' días</b>para el fin de la promo';
}
const SVG_RELOJ = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 3h6"/></svg>';

function pantallaError(titulo, texto){
  $app.innerHTML = '<div class="vacio"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div>';
}

function pintar(d){
  const n = d.objetivo, hechos = d.lavados || [];
  let huecos = '';
  for (let i = 0; i < n; i++) {
    const h = hechos[i];
    huecos += '<div class="hueco' + (h ? ' hecho' : '') + '">' +
      '<div class="casilla"><span class="num">' + (i + 1) + '</span><img src="' + ICONO_LAVADORA + '" alt="">' +
      (h ? '<svg class="tacha" viewBox="0 0 100 100" aria-hidden="true">' +
        '<path class="base t1" d="M22 24 C39 37 58 62 78 78"/><path class="luz t1" d="M24 22 C41 35 60 60 79 76"/>' +
        '<path class="base t2" d="M78 23 C61 39 41 62 23 77"/><path class="luz t2" d="M76 21 C60 37 42 60 25 75"/></svg>' : '') +
      '</div><span class="fecha">' + (h ? esc(fechaCorta(h.fecha)) : '&nbsp;') + '</span></div>';
  }
  huecos += '<div class="hueco premio' + (d.completada ? ' logrado' : '') + '">' +
    '<div class="casilla"><img src="' + ICONO_PREMIO + '" alt=""></div>' +
    '<span class="fecha">' + (d.completada ? '¡Conseguido!' : 'Premio') + '</span></div>';

  const hechosN = Math.min(d.total || hechos.length, n);
  const faltan = Math.max(n - hechosN, 0);
  const dias = diasRestantes(d.caduca);

  let plazo = '';
  if (d.completada) plazo = '<div class="plazo">' + SVG_RELOJ + '<div><b>¡Completa!</b>premio en tu email</div></div>';
  else if (dias !== null) plazo = '<div class="plazo' + (dias <= 3 ? ' urge' : '') + '">' + SVG_RELOJ + '<div>' + textoPlazo(dias) + '</div></div>';

  let mensaje;
  if (d.completada && d.premioEnviado) mensaje = '<div class="msg ok"><b>¡Tarjeta completa!</b> Te hemos enviado tu premio (' + esc(d.premio) + ') por email. Revisa también la carpeta de promociones.</div>';
  else if (d.completada) mensaje = '<div class="msg ok"><b>¡Tarjeta completa!</b> En breve recibirás por email tu premio: ' + esc(d.premio) + '.</div>';
  else {
    const f = faltan === 1 ? 'te falta <b>1 lavado</b>' : 'te faltan <b>' + faltan + ' lavados</b>';
    const q = dias === null ? '' : dias === 0 ? ' y hoy es el último día' : dias === 1 ? ' y queda <b>1 día</b>' : ' y quedan <b>' + dias + ' días</b>';
    mensaje = '<div class="msg">' + f.charAt(0).toUpperCase() + f.slice(1) + q + ' para ganar <b>' + esc(d.premio) + '</b>.</div>';
  }

  $app.innerHTML =
    '<div class="tarjeta">' +
      '<div class="cab"><img class="logo" src="logo.png" alt="Bloomest Actur · Smart Laundry">' +
        '<div class="mes">Promo de<b>' + esc(nombreMes(d.mes)) + '</b></div></div>' +
      '<div class="corte"></div>' +
      '<div class="cuerpo">' +
        '<p class="titulo">' + esc(d.titulo || 'Tarjeta de lavados') + '</p>' +
        '<p class="reto">Completa <b>' + n + ' lavados</b> este mes y gana <b>' + esc(d.premio) + '</b>.</p>' +
        '<div class="rejilla">' + huecos + '</div>' +
        '<div class="estado"><div class="contador"><b>' + hechosN + '</b><span>/ ' + n + '</span><small>lavados</small></div>' + plazo + '</div>' +
        '<div class="barra"><i style="width:' + Math.round(hechosN / n * 100) + '%"></i></div>' +
        mensaje +
        '<div class="pie">Se actualiza sola una vez al día con tus lavados en Bloomest.<br>Tarjeta personal: no compartas el enlace.</div>' +
      '</div>' +
    '</div>' +
    '<div class="aviso" id="aviso" hidden></div>';
  avisoInstalar();
}

function ponerManifest(token){
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  const m = {
    name: 'Mis lavados · Bloomest', short_name: 'Mis lavados',
    start_url: base + '?t=' + encodeURIComponent(token), scope: base,
    display: 'standalone', background_color: '#f3ece2', theme_color: '#b0202f',
    icons: [ { src: base + 'icono-192.png', sizes: '192x192', type: 'image/png' },
             { src: base + 'icono-512.png', sizes: '512x512', type: 'image/png' } ]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  document.head.appendChild(l);
}

function avisoInstalar(){
  const a = document.getElementById('aviso');
  if (!a || standalone) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  a.innerHTML = ios
    ? '<b>Ten tu tarjeta como icono:</b> pulsa <b>Compartir</b> (el cuadrado con la flecha) y elige <b>«Añadir a pantalla de inicio»</b>.'
    : '<b>Ten tu tarjeta como icono:</b> pulsa los <b>tres puntos ⋮</b> del navegador y elige <b>«Instalar aplicación»</b> o «Añadir a pantalla de inicio».';
  a.hidden = false;
}

/* Modo demostración para probar el diseño sin backend: ?demo=3 (lavados hechos) */
function demo(n){
  const hoy = new Date(), objetivo = 5, lav = [];
  for (let i = 0; i < Math.min(n, objetivo); i++) {
    const f = new Date(hoy.getFullYear(), hoy.getMonth(), 2 + i * 4);
    lav.push({ fecha: f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0') });
  }
  const fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
  return { ok: true, mes: hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0'), titulo: 'Tarjeta de lavados',
    objetivo, premio: '1 lavado gratis', lavados: lav, total: n, completada: n >= objetivo, premioEnviado: n >= objetivo,
    caduca: fin.getFullYear() + '-' + String(fin.getMonth() + 1).padStart(2, '0') + '-' + String(fin.getDate()).padStart(2, '0') };
}

async function consultar(token){
  const r = await fetch(API + '?action=data&t=' + encodeURIComponent(token), { redirect: 'follow' });
  return r.json();
}

async function inicio(){
  if (params.has('demo')) { pintar(demo(parseInt(params.get('demo'), 10) || 0)); return; }
  const token = params.get('t') || leer('bl_t');
  if (!token) { pantallaError('Abre tu enlace personal', 'Abre el enlace que te llegó por email para ver tu tarjeta.'); return; }

  // Pinta al instante lo último guardado (funciona sin cobertura) y refresca después.
  const guardado = leer('bl_datos');
  if (guardado) { try { const g = JSON.parse(guardado); if (g.token === token) pintar(g.d); } catch(e){} }
  ponerManifest(token);
  try {
    const d = await consultar(token);
    if (d && d.ok) { guardar('bl_datos', JSON.stringify({ token, d })); guardar('bl_t', token); pintar(d); }
    else { borrar('bl_datos'); pantallaError('Tarjeta no encontrada', 'Este mes no tienes tarjeta activa. Si crees que es un error, habla con la lavandería.'); }
  } catch(e){
    if (!leer('bl_datos')) pantallaError('Sin conexión', 'No se ha podido cargar la tarjeta. Prueba de nuevo con cobertura.');
  }
}
inicio();
</script>
</body>
</html>
